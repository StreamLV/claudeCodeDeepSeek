services:
  claudecode_deepseek:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    container_name: claudecode_deepseek
    environment:
      - ANTHROPIC_BASE_URL=https://api.deepseek.com/anthropic
      - ANTHROPIC_AUTH_TOKEN=${DEEPSEEK_API_KEY}
      - ANTHROPIC_MODEL=deepseek-v4-pro
      - ANTHROPIC_DEFAULT_OPUS_MODEL=deepseek-v4-pro
      - ANTHROPIC_DEFAULT_SONNET_MODEL=deepseek-v4-pro
      - ANTHROPIC_DEFAULT_HAIKU_MODEL=deepseek-v4-flash
      - CLAUDE_CODE_SUBAGENT_MODEL=deepseek-v4-flash
      - API_TIMEOUT_MS=300000
    volumes:
      - ${PROJECT_PATH}:/workspace
      # - ./.claude:/home/node/.claude
      # - ./.claude-config:/home/node/.config/claude
      - claude_deepseek_data:/home/node/.claude
      - claude_deepseek_config:/home/node/.config/claude
      - claude_deepseek_local:/home/node/.local
    working_dir: /workspace
    stdin_open: true
    tty: true
    init: true
    command: [ "sleep", "infinity" ]
volumes:
  claude_deepseek_data:
    name: claude_deepseek_data
  claude_deepseek_config:
    name: claude_deepseek_config
  claude_deepseek_local:
    name: claude_deepseek_local
